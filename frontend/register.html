<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TravelMind AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <i class="fas fa-compass me-2"></i>TravelMind AI
      </a>
    </div>
  </nav>

  <main class="min-vh-100 d-flex align-items-center" style="padding-top: 80px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <i class="fas fa-compass fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-muted">Join TravelMind AI and start planning smarter</p>
              </div>
              
              <form id="registerForm">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label fw-medium">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your full name">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-medium">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password" minlength="6">
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-medium">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Enter your password again">
                  </div>
                </div>
                <div class="mb-3 form-check mt-2">
                  <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                  <label class="form-check-label" for="terms">I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a></label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create Account</button>
              </form>
              
              <div class="text-center">
                <p class="text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-medium">Login</a></p>
              </div>
              
              <div id="registerError" class="alert alert-danger mt-3 d-none"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('registerError');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      errorDiv.classList.add('d-none');
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.classList.remove('d-none');
        return;
      }
      
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.classList.remove('d-none');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
      
      try {
        const userData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password: password
        };
        
        const data = await Auth.register(userData);
        
        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.user));
        
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
